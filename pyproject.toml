[project]
name = "coppertrail"
version = "0.1.0"
description = "Local auction house analysis for WoW Forever. Prices from AHledger."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "duckdb>=2.0",
    "tzdata",
    "pandas>=2.2",
    "numpy>=2",
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.3",
]

[dependency-groups]
dev = [
    "coppertrail[gui]",
    "pyinstaller>=6.10",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coppertrail"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # plan sketches are not runnable code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
coppertrail = { workspace = true }

[tool.uv]
# Lock only for the platforms Coppertrail runs on. pywebview lists qtpy for OpenBSD,
# and Qt must not appear in the lock at all.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'", "sys_platform == 'darwin'"]
