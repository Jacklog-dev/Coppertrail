<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Coppertrail · style sample</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/states.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<style>
  body { overflow: auto; }
  .page { padding: var(--size-view-pad); display: grid; gap: var(--size-gap); grid-template-columns: 1fr 1fr; max-width: 1840px; }
  .wide { grid-column: 1 / -1; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .stack { display: grid; gap: var(--space-3); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-2); }
  .swatch { display: flex; align-items: center; gap: var(--space-2); font-size: var(--type-small-size); color: var(--text2); }
  .swatch b { width: 28px; height: 20px; border: 1px solid var(--border); border-radius: var(--radius-control); flex: none; }
  .head { display: flex; align-items: center; gap: var(--space-3); }
  .section { margin-top: var(--space-5); }
  .states { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--size-gap); }
  .state-demo { height: 470px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg1); }
  .state-demo .demo-label { font-size: var(--type-small-size); color: var(--text3); margin-bottom: var(--space-2); }
  .state-demo .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--border); }
  @media (max-width: 1440px) { .page { grid-template-columns: 1fr; } .states { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="page" id="sample"></div>
<script type="module" src="js/sample.js"></script>
</body>
</html>
