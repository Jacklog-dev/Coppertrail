# Builds dist/Coppertrail.exe on Windows. A pushed tag (v*) attaches the exe to that tag's
# GitHub release; a manual run only keeps it as a workflow artifact. Tags and releases are
# Jack's call: this workflow never creates a tag itself.
#
# Two jobs, so the token that can write releases never sees the build: `build` runs the
# tests and PyInstaller with a read-only token (not persisted in the checkout), `release`
# only downloads the artifact and talks to the GitHub API.
name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Coppertrail-exe
          path: dist/Coppertrail.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Coppertrail-exe
          path: dist
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # no checkout here, so gh needs the repo
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Coppertrail $TAG. Data: Blizzard Entertainment API, not affiliated with or endorsed by Blizzard. Ships no market data."
          gh release upload "$TAG" dist/Coppertrail.exe --clobber
