# Builds dist/Coppertrail.exe on Windows. A pushed tag (v*) attaches the exe to that tag's
# GitHub release; a manual run only keeps it as a workflow artifact. Tags and releases are
# Jack's call: this workflow never creates a tag itself.
name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Coppertrail-exe
          path: dist/Coppertrail.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Coppertrail $TAG. Prices from AHledger (https://ahledger.com). Ships no market data."
          gh release upload "$TAG" dist/Coppertrail.exe --clobber
